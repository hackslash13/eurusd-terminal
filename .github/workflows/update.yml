name: Daily EUR/USD Terminal Auto-Update

on:
  schedule:
    # Runs daily at 01:15 UTC (7:00 AM NPT)
    - cron: '15 1 * * *'
  workflow_dispatch:

jobs:
  update-terminal:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Local Generation Engine
        run: python generate_terminal.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update EUR/USD daily trade setup [NPT 07:00 AM]" && git push)
          
