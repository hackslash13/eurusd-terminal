name: Daily EUR/USD Terminal Auto-Update

on:
  schedule:
    # Runs at 01:15 UTC every day (7:00 AM NPT in Nepal)
    - cron: '15 1 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  update-terminal:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/python-3.x
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Auto-Analysis & Update HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_terminal.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update EUR/USD daily trade setup [NPT 07:00 AM]" && git push)
          
