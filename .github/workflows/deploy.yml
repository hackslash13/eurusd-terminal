name: Update Trade Analysis & Deploy Terminal

on:
  repository_dispatch:
    types: [update_trade_setup]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Write JSON from Payload to analysis.json
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > analysis.json

      - name: Run HTML Generator Script
        run: python generate_terminal.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis.json index.html
          git commit -m "Automated update via MacroDroid dispatch" || exit 0
          git push
          
